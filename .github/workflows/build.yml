name: Build
on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          # .tool-versions の ruby を使う
          bundler-cache: true
      - run: bundle exec jekyll build --trace
